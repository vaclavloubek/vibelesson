name: SEC-014 security header audit

on:
  push:
    branches:
      - sec-014-security-headers

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect production response headers
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            'https://www.syllonaut.com/' \
            'https://www.syllonaut.com/join' \
            'https://www.syllonaut.com/auth/confirm' \
            'https://syllonaut.com/'
          do
            echo "===== $url ====="
            curl --silent --show-error --location --max-time 20 --dump-header - --output /dev/null "$url" \
              | tr -d '\r' \
              | sed -n '1,80p'
            echo
          done
