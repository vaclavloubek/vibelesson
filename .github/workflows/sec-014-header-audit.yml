name: SEC-014 security header audit

on:
  push:
    branches:
      - sec-014-security-headers

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sec-014-security-headers
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify headers from the Next.js app
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
        run: |
          set -euo pipefail
          npm run dev > /tmp/syllonaut-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --silent --fail --max-time 2 http://127.0.0.1:3000/ >/dev/null; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/syllonaut-next.log
              exit 1
            fi
            sleep 1
          done

          check_path() {
            local path="$1"
            local headers
            headers="$(curl --silent --show-error --dump-header - --output /dev/null "http://127.0.0.1:3000${path}" | tr -d '\r' | tr '[:upper:]' '[:lower:]')"
            printf '%s\n' "===== ${path} =====" "$headers"
            grep -q '^content-security-policy:' <<< "$headers"
            grep -q "frame-ancestors 'none'" <<< "$headers"
            grep -q 'https://challenges.cloudflare.com' <<< "$headers"
            grep -q '^strict-transport-security: max-age=63072000$' <<< "$headers"
            grep -q '^x-content-type-options: nosniff$' <<< "$headers"
            grep -q '^x-frame-options: deny$' <<< "$headers"
            grep -q '^referrer-policy: strict-origin-when-cross-origin$' <<< "$headers"
            grep -q '^permissions-policy: camera=(), microphone=(), geolocation=(), payment=(), usb=()$' <<< "$headers"
            grep -q '^x-permitted-cross-domain-policies: none$' <<< "$headers"
            if grep -q '^x-powered-by:' <<< "$headers"; then
              echo 'Unexpected X-Powered-By header'
              exit 1
            fi
          }

          check_path '/'
          check_path '/join'
          check_path '/auth/confirm'

      - name: Record current production baseline
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --location --max-time 20 --dump-header - --output /dev/null 'https://www.syllonaut.com/' \
            | tr -d '\r' \
            | sed -n '1,80p'
