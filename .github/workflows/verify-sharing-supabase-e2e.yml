name: Verify sharing Supabase E2E

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-sharing-supabase:
    if: github.head_ref == 'feature/lesson-sharing-0.9.20'
    runs-on: ubuntu-latest
    steps:
      - name: Run isolated sharing E2E against Supabase
        shell: bash
        run: |
          set -euo pipefail
          curl -sS --max-time 90 -D /tmp/headers -o /tmp/body             "https://qsjddlgmabgmtssvntmn.supabase.co/functions/v1/sharing-e2e-temp-20260919?guard=2d7f0b425e5942d0a97ee75c4484634e"
          cat /tmp/headers
          cat /tmp/body
          code="$(awk 'toupper($1) ~ /^HTTP\// {last=$2} END {print last}' /tmp/headers)"
          echo "HTTP status: $code"
          test "$code" = "200"
          jq -e '.ok == true and .stage == "complete"' /tmp/body >/dev/null
