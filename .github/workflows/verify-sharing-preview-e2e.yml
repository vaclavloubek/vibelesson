name: Verify sharing Preview E2E

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-sharing:
    if: github.head_ref == 'feature/lesson-sharing-0.9.20'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Preview and run isolated sharing E2E
        shell: bash
        env:
          PREVIEW_URL: https://edupilot2-git-feature-lesson-sharing-0920-vaclavloubek1.vercel.app
          E2E_GUARD: 76d33152eb3241d23c489de871b49ebb4bbd8d836c2f9e0b
        run: |
          set -euo pipefail
          curl -sS --max-time 20 -D /tmp/sharing-e2e.headers -o /tmp/sharing-e2e.json \
            -X POST -H "x-syllonaut-e2e: $E2E_GUARD" \
            "$PREVIEW_URL/api/internal/sharing-e2e" || true
          echo "Response headers:"
          cat /tmp/sharing-e2e.headers
          code="$(awk 'toupper($1) ~ /^HTTP\// {last=$2} END {print last}' /tmp/sharing-e2e.headers)"
          echo "Preview E2E returned HTTP $code"
          if [ "$code" = "200" ]; then
            cat /tmp/sharing-e2e.json
            jq -e '.ok == true' /tmp/sharing-e2e.json >/dev/null
            exit 0
          fi
          if [ "$code" = "500" ]; then
            cat /tmp/sharing-e2e.json
          fi
          exit 1
