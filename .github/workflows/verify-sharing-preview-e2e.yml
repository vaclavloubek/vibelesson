name: Verify sharing Preview E2E

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-sharing:
    if: github.head_ref == 'feature/lesson-sharing-0.9.20'
    runs-on: ubuntu-latest
    steps:
      - name: Run isolated sharing E2E against current Preview alias
        shell: bash
        env:
          PREVIEW_URL: https://edupilot2-git-feature-lesson-sharing-0920-vaclavloubek1.vercel.app
          E2E_GUARD: a3e6f0d81c9b4f5292b8f4516e0a7c3d
        run: |
          set -euo pipefail
          curl -sS --max-time 30 -D /tmp/headers -o /tmp/body             -X POST -H "x-syllonaut-e2e: $E2E_GUARD"             "$PREVIEW_URL/api/internal/sharing-e2e" || true
          cat /tmp/headers
          cat /tmp/body
          code="$(awk 'toupper($1) ~ /^HTTP\// {last=$2} END {print last}' /tmp/headers)"
          echo "HTTP status: $code"
          test "$code" = "200"
          jq -e '.ok == true and .stage == "complete"' /tmp/body >/dev/null
