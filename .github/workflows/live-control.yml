name: Live control plane

on:
  pull_request:
    paths:
      - 'cloudflare/live-control/**'
      - '.github/workflows/live-control.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/live-control
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cloudflare/live-control/package.json
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
