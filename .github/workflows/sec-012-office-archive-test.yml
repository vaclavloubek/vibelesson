name: SEC-012 office archive guard

on:
  push:
    branches:
      - sec-012-office-archive-bounds

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Compile archive guard for runtime tests
        run: npx tsc lib/materials.ts lib/office-archive.ts --outDir /tmp/sec012 --module commonjs --target ES2022 --esModuleInterop --skipLibCheck
      - name: Exercise normal and hostile Office archives
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const JSZip = require('jszip');
          const {
            OFFICE_MAX_XML_ENTRY_BYTES,
            OFFICE_MAX_ZIP_ENTRIES,
            assertSafeOfficeZipContainer,
            createOfficeXmlBudget,
            readOfficeXmlText,
          } = require('/tmp/sec012/office-archive.js');

          (async () => {
            const normal = new JSZip();
            normal.file('word/document.xml', '<w:document><w:p><w:t>Bezpečný dokument</w:t></w:p></w:document>');
            const normalBuffer = await normal.generateAsync({ type: 'arraybuffer', compression: 'DEFLATE' });
            assert.doesNotThrow(() => assertSafeOfficeZipContainer(normalBuffer));
            const normalLoaded = await JSZip.loadAsync(normalBuffer);
            const normalText = await readOfficeXmlText(normalLoaded.file('word/document.xml'), createOfficeXmlBudget());
            assert.match(normalText, /Bezpečný dokument/);

            const bomb = new JSZip();
            bomb.file('word/document.xml', 'A'.repeat(OFFICE_MAX_XML_ENTRY_BYTES + 250_000));
            const bombBuffer = await bomb.generateAsync({ type: 'arraybuffer', compression: 'DEFLATE', compressionOptions: { level: 9 } });
            assert.ok(bombBuffer.byteLength < OFFICE_MAX_XML_ENTRY_BYTES / 10, 'fixture should be highly compressed');
            assert.doesNotThrow(() => assertSafeOfficeZipContainer(bombBuffer));
            const bombLoaded = await JSZip.loadAsync(bombBuffer);
            await assert.rejects(
              () => readOfficeXmlText(bombLoaded.file('word/document.xml'), createOfficeXmlBudget()),
              /po rozbalení příliš velký/,
            );

            const manyEntries = new JSZip();
            for (let i = 0; i <= OFFICE_MAX_ZIP_ENTRIES; i += 1) manyEntries.file(`word/x${i}.xml`, '');
            const manyEntriesBuffer = await manyEntries.generateAsync({ type: 'arraybuffer' });
            assert.throws(() => assertSafeOfficeZipContainer(manyEntriesBuffer), /neobvykle mnoho částí/);

            console.log('SEC-012 archive guard tests passed');
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
