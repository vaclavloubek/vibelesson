name: SEC-008 lockfile probe

on:
  push:
    branches:
      - sec-008-deterministic-deps

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package.json
      - name: Record toolchain
        run: |
          node --version > toolchain.txt
          npm --version >> toolchain.txt
      - name: Generate lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify clean install
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run check
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Upload probe artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sec008-lockfile-probe
          path: |
            package-lock.json
            toolchain.txt
          if-no-files-found: error
          retention-days: 1
      - name: Commit verified lockfile
        run: |
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Add verified npm lockfile for SEC-008"
          git push
