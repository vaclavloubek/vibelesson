name: Apply sharing preview security fix

on:
  push:
    branches:
      - feature/lesson-sharing-0.9.20
    paths:
      - .github/workflows/apply-sharing-preview-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/lesson-sharing-0.9.20

      - name: Apply and verify the reviewed fix
        shell: bash
        run: |
          printf '%s' '' | base64 --decode > /tmp/sharing-preview-fix.patch
          test "$(sha256sum /tmp/sharing-preview-fix.patch | awk '{print $1}')" = 'a608575cbb438dd52ead3c8e954c35949c9bde403a211acb5ae9d7c2618347c9'
          git apply --check /tmp/sharing-preview-fix.patch
          git apply /tmp/sharing-preview-fix.patch
          node scripts/verify-lesson-sharing.mjs
          git diff --check

      - name: Commit the verified fix
        shell: bash
        run: |
          rm .github/workflows/apply-sharing-preview-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/s/[token]/page.tsx' \
            supabase/migrations/20260919111000_add_lesson_sharing_and_session_concurrency.sql \
            supabase/tests/lesson_sharing_rls.test.sql \
            scripts/verify-lesson-sharing.mjs \
            .github/workflows/apply-sharing-preview-fix.yml
          git commit -m "Harden public lesson share preview"
          git push origin HEAD:feature/lesson-sharing-0.9.20
