name: Update worksheet PDF lockfile

on:
  push:
    branches:
      - feature/server-worksheet-pdf-0.9.27
    paths:
      - '.github/workflows/update-worksheet-pdf-lock.yml'

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/server-worksheet-pdf-0.9.27
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Update package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit package-lock
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sync pdfmake package lock"
          git push origin HEAD:feature/server-worksheet-pdf-0.9.27
