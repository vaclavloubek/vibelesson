name: Security headers

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-config:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Start Preview-configured Next.js server
        shell: bash
        env:
          VERCEL_ENV: preview
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
        run: |
          set -euo pipefail
          npm run dev > /tmp/syllonaut-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --silent --fail --max-time 2 http://127.0.0.1:3000/ >/dev/null; then
              npm run check:security-headers -- http://127.0.0.1:3000
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/syllonaut-next.log
              exit 1
            fi
            sleep 1
          done

          cat /tmp/syllonaut-next.log
          exit 1

  production-live:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify live production headers after deploy
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..18}; do
            if npm run check:security-headers -- https://www.syllonaut.com; then
              exit 0
            fi
            if [ "$attempt" -eq 18 ]; then
              echo 'Production security headers did not converge after deployment wait.'
              exit 1
            fi
            sleep 10
          done
