name: Password reveal validation

on:
  push:
    branches:
      - auth-password-reveal-20260917

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply password reveal fields
        run: |
          python - <<'PY'
          from pathlib import Path

          auth = Path('components/AuthControls.tsx')
          text = auth.read_text()
          old = "import { createClient } from '@/lib/supabase/client';"
          new = old + "\nimport PasswordField from '@/components/PasswordField';"
          assert old in text and "PasswordField from '@/components/PasswordField'" not in text
          text = text.replace(old, new, 1)

          replacements = {
            '<label>Heslo<input type="password" value={password} onChange={(e) => setPassword(e.target.value)} autoComplete="current-password" minLength={8} required /></label>': '<PasswordField label="Heslo" value={password} onChange={(e) => setPassword(e.target.value)} autoComplete="current-password" minLength={8} required />',
            '<label>Heslo<input type="password" value={password} onChange={(e) => setPassword(e.target.value)} autoComplete="new-password" minLength={8} required /></label>': '<PasswordField label="Heslo" value={password} onChange={(e) => setPassword(e.target.value)} autoComplete="new-password" minLength={8} required />',
            '<label>Heslo znovu<input type="password" value={passwordConfirm} onChange={(e) => setPasswordConfirm(e.target.value)} autoComplete="new-password" minLength={8} required /></label>': '<PasswordField label="Heslo znovu" value={passwordConfirm} onChange={(e) => setPasswordConfirm(e.target.value)} autoComplete="new-password" minLength={8} required />',
          }
          for old_snippet, new_snippet in replacements.items():
              assert old_snippet in text, old_snippet
              text = text.replace(old_snippet, new_snippet, 1)
          auth.write_text(text)

          update = Path('components/UpdatePasswordForm.tsx')
          text = update.read_text()
          old = "import { createClient } from '@/lib/supabase/client';"
          new = old + "\nimport PasswordField from '@/components/PasswordField';"
          assert old in text and "PasswordField from '@/components/PasswordField'" not in text
          text = text.replace(old, new, 1)
          old_block = '''          <label>\n            Nové heslo\n            <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} autoComplete="new-password" minLength={8} required />\n          </label>\n          <label>\n            Nové heslo znovu\n            <input type="password" value={passwordConfirm} onChange={(e) => setPasswordConfirm(e.target.value)} autoComplete="new-password" minLength={8} required />\n          </label>'''
          new_block = '''          <PasswordField label="Nové heslo" value={password} onChange={(e) => setPassword(e.target.value)} autoComplete="new-password" minLength={8} required />\n          <PasswordField label="Nové heslo znovu" value={passwordConfirm} onChange={(e) => setPasswordConfirm(e.target.value)} autoComplete="new-password" minLength={8} required />'''
          assert old_block in text
          text = text.replace(old_block, new_block, 1)
          update.write_text(text)
          PY
      - run: npm install
      - run: npm run check
      - run: npm run build
      - name: Commit validated implementation
        run: |
          git config user.name "vaclavloubek"
          git config user.email "vaclav.loubek@gmail.com"
          git add components/AuthControls.tsx components/UpdatePasswordForm.tsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "[skip ci] Add password reveal controls"
          git push
